[pytest]
# `pytest -q` from here runs everything on 8 processes (pytest-xdist), each file's tests in one of them so that what a file's
# tests share is made once.  `-n 0` for one process: a debugger, or to time a test.  tests/policy/conftest.py keeps each
# process's maths to one thread.
testpaths = sim/tests tests
addopts = -n 8 --dist loadfile
